<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>INICIAR SESIÓN</h1>
        <form action="validar_cuenta.php" method="POST">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">ESTOY DENTRO!</button>
        </form>
        <button class="btn" onclick="window.location.href='registro_cuenta.html'">CREAR CUENTA</button>
        <button class="btn" onclick="window.location.href='PAG1.html'">REGRESAR</button>
    </div>
</body>
</html>
