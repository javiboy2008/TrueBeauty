<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>True beauty</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(to bottom, rgb(255, 255, 255), #874f4f); display: flex; flex-direction: column; align-items: center; padding: 20px; }
        h1 { font-size: 2rem; margin-bottom: 30px; color: #333; }
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); grid-gap: 30px; width: 100%; max-width: 1200px; }
        .product { background-color: white; border: 1px solid #e0e0e0; border-radius: 10px; padding: 20px; text-align: center; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); transition: transform 0.2s ease; }
        .product:hover { transform: scale(1.02); }
        .product img { width: 100%; max-width: 200px; height: auto; margin-bottom: 20px; }
        .product-name { font-size: 1.2rem; margin-bottom: 10px; color: #333; text-align: justify; }
        .product-color { font-size: 0.9rem; margin-bottom: 15px; color: #777; text-align: justify; }
        .product-options { display: flex; flex-direction: column; gap: 10px; }
        select, button { padding: 10px; width: 100%; max-width: 200px; border: 1px solid #ccc; border-radius: 5px; background-color: #f7f7f7; cursor: pointer; font-size: 1rem; }
        select:hover, button:hover { background-color: #eaeaea; }
        button { background-color: #fff236; color: rgb(255, 255, 255); transition: background-color 0.2s ease; }
        button:hover { background-color: #b4a907; }
        .buy-button { background-color: #d32f2f; }
        .buy-button:hover { background-color: #b71c1c; }
        .nav-buttons { margin-top: 40px; display: flex; justify-content: space-between; width: 100%; max-width: 600px; }
        .nav-buttons button { background-color: #1e4ff0; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; transition: background-color 0.3s; }
        .nav-buttons button:hover { background-color: #082ea8; }
        .next-button { background-color: #007BFF; }
        .next-button:hover { background-color: #0056b3; }
        @media (max-width: 768px) { .product-grid { grid-template-columns: 1fr; } .nav-buttons { flex-direction: column; gap: 10px; align-items: center; } }
    </style>
</head>
<body>

    <h1>CREMAS PARA EL CABELLO</h1>

    <div class="product-grid">
        <div class="product">
            <img src="PRODUCTOS1.jpg" alt="Producto 1">
            <div class="product-name">CAPTURE TOTALE(50g)</div>
            <div class="product-color">Caracteristicas:Recupera el brillo natural de cabello</div>
            <div class="product-options">
                <select id="cant-1">
                    <option value="1">Cantidad: 1</option>
                    <option value="2">Cantidad: 2</option>
                    <option value="3">Cantidad: 3</option>
                    <option value="4">Cantidad: 4</option>
                </select>
                <button onclick="agregarAlCarrito('CAPTURE TOTALE(50g)', 'cant-1')">Agregar al carrito</button>
                <button class="buy-button" onclick="comprarAhora('CAPTURE TOTALE(50g)', 'cant-1')">Comprar</button>
            </div>
        </div>
        <div class="product">
            <img src="PRODUCTOS2.jpg" alt="Producto 2">
            <div class="product-name">Dior PRESTIGE(65g)</div>
            <div class="product-color">Caracteristicas:Aumenta el crecimiento </div>
            <div class="product-options">
                <select id="cant-2">
                    <option value="1">Cantidad: 1</option>
                    <option value="2">Cantidad: 2</option>
                    <option value="3">Cantidad: 3</option>
                    <option value="4">Cantidad: 4</option>
                </select>
                <button onclick="agregarAlCarrito('Dior PRESTIGE(65g)', 'cant-2')">Agregar al carrito</button>
                <button class="buy-button" onclick="comprarAhora('Dior PRESTIGE(65g)', 'cant-2')">Comprar</button>
            </div>
        </div>
        <div class="product">
            <img src="PRODUCTOS3.jpg" alt="Producto 3">
            <div class="product-name">Dior PRETIGE(60g)</div>
            <div class="product-color">Caracteristicas:Evita la caida de cabello</div>
            <div class="product-options">
                <select id="cant-3">
                    <option value="1">Cantidad: 1</option>
                    <option value="2">Cantidad: 2</option>
                    <option value="3">Cantidad: 3</option>
                    <option value="4">Cantidad: 4</option>
                </select>
                <button onclick="agregarAlCarrito('Dior PRETIGE(60g)', 'cant-3')">Agregar al carrito</button>
                <button class="buy-button" onclick="comprarAhora('Dior PRETIGE(60g)', 'cant-3')">Comprar</button>
            </div>
        </div>
        <div class="product">
            <img src="PRODUCTOS4.jpg" alt="Producto 4">
            <div class="product-name">Miss Dior(50g)</div>
            <div class="product-color">Caracteristicas:Fortalece el cabello</div>
            <div class="product-options">
                <select id="cant-4">	
                    <option value="1">Cantidad: 1</option>
                    <option value="2">Cantidad: 2</option>
                    <option value="3">Cantidad: 3</option>
                    <option value="4">Cantidad: 4</option>
                </select>
                <button onclick="agregarAlCarrito('Miss Dior(50g)', 'cant-4')">Agregar al carrito</button>
                <button class="buy-button" onclick="comprarAhora('Miss Dior(50g)', 'cant-4')">Comprar</button>
            </div>
        </div>
    </div>
    <div class="nav-buttons">
        <button onclick="location.href='PAG4.html'">← Volver</button>
        <button class="next-button" onclick="location.href='PAG6.html'">Siguiente →</button>
    </div>

<script>
function agregarAlCarrito(nombre, idCantidad) {
    let cantidad = parseInt(document.getElementById(idCantidad).value);
    let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
    
    let existente = carrito.find(p => p.nombre === nombre);
    if (existente) {
        existente.cantidad += cantidad;
    } else {
        carrito.push({ nombre: nombre, cantidad: cantidad });
    }
    
    localStorage.setItem('carrito', JSON.stringify(carrito));
    alert(nombre + " x" + cantidad + " agregado al carrito. Sigue en esta página agregando más.");
}

function comprarAhora(nombre, idCantidad) {
    agregarAlCarrito(nombre, idCantidad);
    window.location.href = 'PAG11.html'; // aquí te manda a comprar, si tu página es PAG11.html cambialo
}
</script>

</body>
</html>
