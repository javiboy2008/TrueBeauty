<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAIS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fa72a6, #fca2c4, #f3dce5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 10)
        }

        .top-bar {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%;
            height: 50px;
            background: linear-gradient(90deg, rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.3));
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000; 
            box-shadow: 0 5px 10px rgba(0, 0, 1, 1.5);
        }

        .top-bar a {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
            font-family: 'Times New Roman', Times, serif;
        }

        .top-bar a:hover {
            color: #000000;
        }

        .carousel-container {
            position: relative;
            width: 70%;
            max-width: 1000px;
            height: 350px;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 5px 10px rgba(0, 0, 1, 1.5);
        }

        .carousel {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }

        .carousel img {
            width: 100%;
            object-fit: cover;
        }

        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.8);
            color: #333;
            border: none;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            padding: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }

        .arrow:hover {
            background: rgba(255, 255, 255, 1);
        }

        .arrow.left {
            left: 15px;
        }

        .arrow.right {
            right: 15px;
        }

        .dots {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .dot.active {
            background-color: #333;
        }
        footer {
            margin-inline-end: 2px;
            padding: 50px;
            color: white;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <span>TRUE BEAUTY</span>
        <a href="validar_cuenta.html" target="_blank">PERFIL</a>
        <a href="validar_admin.html" target="_blank">
    <span class="admin-icon">👤</span> ADMINISTRADOR
</a>
    </div>
    <div class="carousel-container">
        <div class="carousel">
            <img src="I1.jpeg" alt="DIOR">
            <img src="I2.jpeg" alt="DIOR">
            <img src="I3.jpeg" alt="DIOR">
        </div>
        <button class="arrow left">&#10094;</button>
        <button class="arrow right">&#10095;</button>
    </div>
    <div class="dots">
        <div class="dot active" data-index="0"></div>
        <div class="dot" data-index="1"></div>
        <div class="dot" data-index="2"></div>
    </div>

    <script>
        const carousel = document.querySelector('.carousel');
        const images = document.querySelectorAll('.carousel img');
        const dots = document.querySelectorAll('.dot');
        const prevButton = document.querySelector('.arrow.left');
        const nextButton = document.querySelector('.arrow.right');
        let currentIndex = 0;
        const totalImages = images.length;
        const intervalTime = 4000;
        let autoSlide;

        function updateCarousel() {
            carousel.style.transform = `translateX(-${currentIndex * 100}%)`;
            dots.forEach(dot => dot.classList.remove('active'));
            dots[currentIndex].classList.add('active');
        }

        function showNextImage() {
            currentIndex = (currentIndex + 1) % totalImages;
            updateCarousel();
        }

        function showPrevImage() {
            currentIndex = (currentIndex - 1 + totalImages) % totalImages;
            updateCarousel();
        }

        function startAutoSlide() {
            autoSlide = setInterval(showNextImage, intervalTime);
        }

        function stopAutoSlide() {
            clearInterval(autoSlide);
        }

        nextButton.addEventListener('click', () => {
            stopAutoSlide();
            showNextImage();
            startAutoSlide();
        });

        prevButton.addEventListener('click', () => {
            stopAutoSlide();
            showPrevImage();
            startAutoSlide();
        });

        dots.forEach(dot => {
            dot.addEventListener('click', (e) => {
                stopAutoSlide();
                currentIndex = parseInt(e.target.dataset.index);
                updateCarousel();
                startAutoSlide();
            });
        });

        startAutoSlide();
    </script>
     <footer>
        © 2024 TRUE BEAUTY
    </footer>
</body>
</html>
