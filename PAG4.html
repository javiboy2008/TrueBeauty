<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INDICE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
       
        body {
            font-family: 'Arial Narrow Bold';
            background: linear-gradient(to bottom, white, black);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-bar {
            width: 60%;
        }

        .search-bar input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        .icons {
            display: flex;
            gap: 20px;
        }

        .icons img {
            width: 50px;
            height: 50px;
            cursor: pointer;
        }

        .rectangles-container {
            margin-top: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .rectangle {
            position: relative;
            width: 80%;
            max-width: 400px;
            height: 150px;
            margin: 20px 0;
            background-size: cover;
            background-position: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s ease;
            filter: blur(1.0); 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .rectangle:hover {
            transform: scale(1.05);
            filter: blur(0px); 
        }

        .rectangle span {
            position: absolute;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 10); 
            z-index: 1;
        }

        footer {
            margin-top: auto;
            padding: 20px;
            color: white;
        }
    </style>
</head>
